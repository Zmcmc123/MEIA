<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MEIA 3D Viewer</title>
    <script type="module" crossorigin src="./assets/index-Cl0k8g1R.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DRmeI5CX.css">
  </head>
  <body>
    <main class="viewer-shell">
      <div id="view-tools" class="view-tools">
        <label class="angle-step">
          <span id="angle-step-label"></span>
          <input
            id="angle-step"
            type="number"
            value="90"
            min="0.1"
            max="90"
            step="0.1"
            inputmode="decimal"
          />
          <span>°</span>
        </label>
        <div id="orbit-pad" class="orbit-pad">
          <button class="tool-button orbit-up" type="button" data-orbit="up" disabled>↑</button>
          <button class="tool-button orbit-left" type="button" data-orbit="left" disabled>←</button>
          <button class="tool-button orbit-down" type="button" data-orbit="down" disabled>↓</button>
          <button class="tool-button orbit-right" type="button" data-orbit="right" disabled>→</button>
        </div>
        <div id="axis-presets" class="axis-presets">
          <button class="tool-button axis-button" type="button" data-axis="a" disabled>a <span>(100)</span></button>
          <button class="tool-button axis-button" type="button" data-axis="b" disabled>b <span>(010)</span></button>
          <button class="tool-button axis-button" type="button" data-axis="c" disabled>c <span>(001)</span></button>
        </div>
      </div>
      <div id="selection-tools" class="selection-tools">
        <button
          id="selection-mode"
          class="tool-button selection-mode-button"
          type="button"
          aria-pressed="false"
          disabled
        ></button>
        <span id="selection-hint"></span>
        <span id="selection-count"></span>
        <button
          id="clear-selection"
          class="tool-button selection-action-button"
          type="button"
          disabled
        ></button>
        <button id="confirm-selection" type="button" disabled></button>
      </div>
      <div id="viewer-wrap">
        <div id="viewer"></div>
        <svg
          id="selection-overlay"
          aria-hidden="true"
        >
          <rect id="selection-box" x="0" y="0" width="0" height="0"></rect>
        </svg>
      </div>
      <div class="viewer-controls">
        <button id="apply-camera" type="button" disabled></button>
        <span id="status" role="status" aria-live="polite"></span>
      </div>
    </main>
  </body>
</html>
