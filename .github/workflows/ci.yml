name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.10
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q app.py meia tests
      - name: Validate public documentation
        run: python -m meia.check_public_docs
      - name: Run routine Python tests
        run: python -m pytest -W error::FutureWarning --strict-markers -q -m "not release"
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/meia-mpl-cache
      - name: Run release-integrity Python tests
        run: python -m pytest -W error::FutureWarning --strict-markers -q -m release
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/meia-mpl-cache

  frontend:
    name: Frontend Node 18
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: meia/components/atom_viewer/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: meia/components/atom_viewer/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit production frontend dependencies
        run: npm audit --omit=dev
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Verify committed frontend build
        working-directory: .
        run: git diff --exit-code -- meia/components/atom_viewer/frontend/dist
